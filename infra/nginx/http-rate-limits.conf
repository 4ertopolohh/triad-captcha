# Include this snippet from Nginx's `http {}` context, never from `server {}`.
# $binary_remote_addr is an edge control only; application decisions use
# TriadCAPTCHA's trusted-proxy-aware, HMAC-pseudonymized signals.
limit_req_zone $binary_remote_addr zone=triad_challenge:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=triad_sensitive:10m rate=30r/m;

