worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Do not persist raw client addresses, query strings, referers, or full
    # User-Agent values. Django's protected audit uses keyed pseudonyms.
    log_format triad '$request_id [$time_local] $request_method '
                     '$status $body_bytes_sent';
    access_log /dev/stdout triad;
    error_log /dev/stderr crit;

    # This file contains limit_req_zone and MUST be loaded from http context.
    include /etc/nginx/snippets/http-rate-limits.conf;

    upstream triad_backend {
        server backend:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        include /etc/nginx/snippets/triadcaptcha-locations.conf;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
