# Include this snippet inside the host's `server {}` block after defining
# triad_backend (or replace proxy_pass with the host application's upstream).
error_page 429 = @triadcaptcha_rate_limited;

location @triadcaptcha_rate_limited {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "6" always;
    return 429 '{"error":{"code":"ANTIBOT_RATE_LIMITED","retry_after":6}}';
}

location ~ ^/api/triadcaptcha/challenge/?$ {
    limit_req zone=triad_challenge burst=5 nodelay;
    limit_req_status 429;
    limit_req_log_level notice;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://triad_backend;
}

location ~ ^/api/(register|login|lead|send-code|password-reset)/?$ {
    limit_req zone=triad_sensitive burst=10 nodelay;
    limit_req_status 429;
    limit_req_log_level notice;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://triad_backend;
}

location /api/ {
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://triad_backend;
}

location /admin/ {
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://triad_backend;
}

location /static/ {
    proxy_set_header Host $http_host;
    proxy_pass http://triad_backend;
}
