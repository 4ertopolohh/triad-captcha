[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triadcaptcha-django"
version = "0.2.0"
description = "Self-hosted adaptive anti-bot protection for Django"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "TriadCAPTCHA contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "Django>=4.2,<6.2",
  "altcha>=2.1.0,<3",
  "redis>=6,<9",
]

[project.optional-dependencies]
test = [
  "fakeredis[lua]>=2.23,<3",
  "hypothesis>=6.100,<7",
  "pytest>=8,<10",
  # 4.12+ assumes Django TestCase internals introduced after Django 4.2.
  "pytest-django>=4.8,<4.12",
  "pytest-cov>=5,<8",
]
lint = ["ruff>=0.9,<1"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
